# nFPM package configuration for pinentry-libsecret
# https://nfpm.goreleaser.com

name: "pinentry-libsecret"
arch: "all"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "akeyx"
description: "Native Qt & multi-toolkit Pinentry wrapper for GnuPG and Freedesktop Secret Service (libsecret)"
vendor: "akeyx"
homepage: "https://github.com/akeyx/pinentry-libsecret"
license: "MIT"

# System dependencies
depends:
  - python3
  - libsecret

recommends:
  - python3-pyqt6
  - kdialog
  - zenity

# Target installation files
contents:
  - src: "pinentry-libsecret"
    dst: "/usr/bin/pinentry-libsecret"
    file_info:
      mode: 0755
  - src: "LICENSE"
    dst: "/usr/share/licenses/pinentry-libsecret/LICENSE"
    file_info:
      mode: 0644
  - src: "README.md"
    dst: "/usr/share/doc/pinentry-libsecret/README.md"
    file_info:
      mode: 0644
